name: RunwayGauge
options:
  bundleIdPrefix: com.mirabilia
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
schemes:
  UsageWidgetTests:
    build:
      targets:
        UsageWidget: all
        UsageWidgetTests: [test]
    test:
      targets:
        - UsageWidgetTests
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    ENABLE_HARDENED_RUNTIME: 'YES'
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: '100'
packages:
  UsageCore:
    path: Core
targets:
  RunwayGauge:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared/CycleAccountIntent.swift
      - path: Shared/OpenSettingsIntent.swift
      - path: AppIcon.icon
      - path: scripts/helpers-bundle/Helpers
        type: folder
        buildPhase: resources
      - path: scripts/install-helpers-from-bundle.sh
        buildPhase: resources
    dependencies:
      - package: UsageCore
        product: UsageCore
      - target: UsageWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirabilia.RunwayGauge
        CODE_SIGN_ENTITLEMENTS: App/RunwayGauge.entitlements
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  UsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - path: Shared/CycleAccountIntent.swift
      - path: Shared/OpenSettingsIntent.swift
    dependencies:
      - package: UsageCore
        product: UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirabilia.RunwayGauge.UsageWidget
        CODE_SIGN_ENTITLEMENTS: Widget/UsageWidget.entitlements
        INFOPLIST_FILE: Widget/Info.plist
  RunwayGaugeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: RunwayGauge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirabilia.RunwayGaugeTests
        GENERATE_INFOPLIST_FILE: 'YES'
  UsageWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WidgetTests
      - path: Widget/UsageTimeline.swift
    dependencies:
      - target: UsageWidget
      - package: UsageCore
        product: UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirabilia.RunwayGauge.UsageWidgetTests
        GENERATE_INFOPLIST_FILE: 'YES'
